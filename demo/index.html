  <body>
    <main id="demo">
      <noscript>
        <h1>Jackpot</h1>
        <p>
          Two FFGL plugins, a source and an effect that plays over your clip,
          with a one-armed bandit, a roulette wheel, the money wheel, a craps
          table and the lottery drum, plus chips and coins raining down on a
          win. Every game is simulated properly, then repainted so it lands on a
          random result or the one you picked, at exactly Spin Time or on the
          next beat or bar. The physics never finds out it's been fixed.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/jackpot">its repository</a>.
        </p>
